<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5B800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="si1-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="si1-180.png">
<title>しおりラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: 1列のまるい白カードを、あたたかい紙色の上に並べる。上にマリーゴールドの帯、下に大きなボタン */
:root{
  --card:#FFFFFF; --danger:#E0484D; --back-bg:rgba(255,255,255,.32);
  --bg:#FFF8DE; --soft:#FFFCF0; --line:#F2E4B4; --ink:#352E19; --sub:#7C6D43; --acc:#F5B800; --acc-d:#8F6A00; --acc-l:#FFF5CC; --acc-s:#E09E00; --acc-on:#4A3800; --leaf:#3E8E41; --leaf-d:#2A6B2D; --leaf-l:#E3F1DD; --hint-bg:#FFFAE3; --hint-sh:#E9D9A3;
  --round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Noto Sans JP',sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--round);font-size:16px;line-height:1.6;font-weight:500;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
html{overflow-y:scroll;scrollbar-gutter:stable}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 120px;box-sizing:border-box}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px;background:var(--acc);color:var(--acc-on);display:flex;align-items:center;gap:10px;min-height:36px}
.bar .logo{width:32px;height:32px;flex:none}
.bar h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.06em}
.bar h1 small{font-size:12px;font-weight:700;letter-spacing:0;margin-left:8px;opacity:.9}
.bar-t{flex:1;min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--back-bg);color:var(--acc-on);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;flex:none}
.main{display:grid;gap:14px;padding-top:14px}
.card{background:var(--card);border-radius:22px;padding:18px;display:grid;gap:14px;box-shadow:0 3px 0 var(--line);min-width:0}
.card h2,.card h3{margin:0;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
.card h2{font-size:21px}.card h3{font-size:18px}
.card h3 small{font-size:13px;color:var(--sub);font-weight:700}
.note{margin:0;font-size:13px;color:var(--sub);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border:0;border-radius:26px;background:var(--acc);color:var(--acc-on);font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--acc-d);transition:transform .08s,box-shadow .08s;text-decoration:none;box-sizing:border-box}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-d)}
.btn.big{width:100%;height:60px;font-size:19px;border-radius:30px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* home */
.hero{background:var(--card);border-radius:26px;padding:22px 18px 20px;display:grid;gap:14px;box-shadow:0 3px 0 var(--line);text-align:center}
.hero h2{margin:0;font-size:24px;font-weight:900;line-height:1.35}
.hero p{margin:0;color:var(--sub);font-size:14px}
.marks{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.marks img{width:34px;height:34px}
.sc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:14px;box-shadow:0 3px 0 var(--line)}
.sc .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sc .ic img{width:38px;height:38px}
.sc .ic img.ph{width:100%;height:100%;object-fit:cover}
.sc b{display:block;font-size:17px;font-weight:900;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .meta{font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;background:var(--acc-l);color:var(--acc-d)}
.tag.now{background:var(--leaf-l);color:var(--leaf-d)}.tag.gray{background:#EFE8DF;color:var(--sub)}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--leaf)}
.sc .csw{align-self:start;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:var(--sub);white-space:nowrap}.csw i{width:24px;height:24px;border-radius:50%;display:block;background:linear-gradient(135deg,var(--c) 0 58%,var(--c2) 58% 100%)}
.sc .ops{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sc .ops .btn{height:42px;font-size:15px;padding:0 16px}
.sc .ops .open{flex:1}
.conf{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF0F0;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.conf .btn{height:40px;font-size:14px;padding:0 16px}
.btn.red{background:var(--danger);color:#fff;box-shadow:0 4px 0 #A82E33}
.hintc{background:var(--hint-bg);box-shadow:0 3px 0 var(--hint-sh)}.hl{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:15px}
.pastbtn{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;font-weight:900;font-size:15px;color:var(--sub)}.pastbtn em{font-style:normal;font-size:13px;color:var(--acc-d)}
.snote{grid-column:1/-1;margin:0;font-size:12px;line-height:1.5;color:var(--sub)}
.link{border:0;background:none;color:var(--acc-d);font-weight:900;font-size:15px;padding:8px 0;text-align:left;text-decoration:underline;text-underline-offset:4px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding-top:14px}
.st{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.25;color:var(--sub);font-weight:700;padding:0 2px;text-align:center}
.st span{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;box-sizing:border-box}
.st.ok span{background:var(--leaf);border-color:var(--leaf);color:#fff}
.st.on{color:var(--ink)}.st.on span{background:var(--acc);border-color:var(--acc);color:var(--acc-on);transform:scale(1.12)}
.hint{display:flex;gap:10px;align-items:flex-start}
.hint .av{width:42px;height:42px;border-radius:50%;background:var(--acc);flex:none;display:flex;align-items:center;justify-content:center}
.hint .av img{width:26px;height:26px}
.hint p{margin:0;background:#fff;border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:15px;line-height:1.55;box-shadow:0 2px 0 var(--line);flex:1;min-width:0}
/* fields */
.f{display:grid;gap:6px;min-width:0}
.f>span{font-weight:700;font-size:15px}
input,textarea,select{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#FFFDF9;color:var(--ink);min-width:0}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-l)}
input[type=date],input[type=time]{min-height:50px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#F6EBDA;border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;border-radius:12px;padding:11px 6px;font-weight:700;background:none;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ib{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 2px 6px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--sub)}
.ib img{width:40px;height:40px}
.ib.on{border-color:var(--acc);background:var(--acc-l);color:var(--ink)}
.colors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 2px}
.thpick{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:12px;align-items:start}
.thpick .cl{font-size:10px;letter-spacing:0;white-space:nowrap}.thpick .cl i{width:34px;height:34px}
.thpv{aspect-ratio:148/210;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(90,60,30,.18);background:#fff;max-width:100%;pointer-events:none}
.cl{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
.cl i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--c) 0 58%,var(--c2) 58% 100%);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.cl.on{color:var(--ink)}.cl.on i{outline:3px solid var(--c);outline-offset:3px}
.pick{position:relative}
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-prev{display:grid;gap:10px}
.photo-prev img{width:100%;border-radius:14px;display:block}
.prow{display:grid;grid-template-columns:7.4em minmax(0,1fr) 40px;gap:6px;padding:10px;background:var(--soft);border-radius:16px}
.prow input{padding:9px 10px;font-size:16px}
.prow .w2{grid-column:1/3}
.pic{grid-column:3;border:2px dashed var(--line);background:#fff;border-radius:12px;font-size:12px;font-weight:900;color:var(--sub);padding:0;display:flex;align-items:center;justify-content:center;min-height:40px}.pic.on{border-style:solid;border-color:var(--acc);background:var(--acc-l)}.pic img{width:28px;height:28px}
.icpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;background:var(--soft);border:2px solid var(--line);border-radius:14px}
.ib.sm{padding:4px 0;font-size:10px;border-radius:10px;letter-spacing:0;white-space:nowrap}.ib.sm img{width:28px;height:28px}.ib.sm.none{align-content:center;font-size:12px}
.selw{display:grid;gap:8px;margin-bottom:12px}.selw>span{font-weight:900;font-size:15px}.selw small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.selrow{display:flex;gap:12px;padding-top:6px}
.sel{position:relative;width:58px;height:58px;border:2px solid var(--acc);background:var(--acc-l);border-radius:14px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .12s,box-shadow .12s}
.sel img{width:40px;height:40px;pointer-events:none}.sel b{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-on);font-size:12px;display:flex;align-items:center;justify-content:center}
.sel.drag{transform:scale(1.15);box-shadow:0 8px 16px rgba(0,0,0,.2);z-index:2;cursor:grabbing}.selrow.dragging .sel:not(.drag){opacity:.65}
.x{width:40px;height:40px;border-radius:12px;border:0;background:#F6EBDA;color:var(--sub);font-size:20px;font-weight:900;line-height:1;align-self:center}
.add{border:2px dashed var(--acc);background:var(--soft);color:var(--acc-d);border-radius:16px;padding:12px;font-weight:900;font-size:16px}
.add[disabled]{opacity:.4}
.btn2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px}
.add.sub{border:2px solid var(--line);color:var(--ink);background:#fff}
.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}.seg4 button{font-size:14px;padding:11px 2px}
.fo[disabled]{opacity:.45}
.cnt{margin:0;font-size:13px;color:var(--sub);text-align:right}
.cnt.warn{color:var(--danger);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sugs{display:grid;gap:12px}.sg{display:grid;gap:6px}.sgl{font-size:13px;font-weight:900;color:var(--sub)}
.addcat{display:grid;gap:8px}
.csel{width:auto;flex:none;max-width:8.5em;font-size:13px;padding:6px 8px;border-radius:10px}
.rmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:-6px}.rmeta .sh{margin-top:0}
.srcb{display:flex;gap:6px}.srcb button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--sub)}.srcb button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip.lk{text-decoration:none;color:var(--ink);display:inline-block}.chip.lk::before{content:none}
.sh{justify-self:start;font-size:14px;font-weight:700;color:var(--acc-d);text-decoration:underline;text-underline-offset:3px;margin-top:-6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700}
.chip::before{content:"＋";color:var(--acc);margin-right:4px;font-weight:900}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.row2 .btn{height:48px;padding:0 18px}
.lst{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:var(--soft);border-radius:14px;min-width:0}
.li span{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.qz{display:grid;gap:8px;padding:12px;background:var(--soft);border-radius:16px}.qz+.qz{margin-top:10px}.qzh{font-weight:900;color:var(--acc-d)}
.qrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center}
.ql{width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);color:var(--acc-d);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;box-sizing:border-box}
.ans{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.ans.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.yen-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:700}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 6.5em auto 40px;gap:6px;align-items:center}
.wrow input{padding:9px 10px;font-size:16px}
.wrow input.pr{text-align:right;font-variant-numeric:tabular-nums}
.sum{display:flex;gap:16px;justify-content:flex-end;align-items:baseline;font-weight:700;flex-wrap:wrap}
.sum b{font-size:20px;font-variant-numeric:tabular-nums}
.sum .neg{color:var(--danger)}
/* done */
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px;display:grid;gap:6px;text-align:left;align-content:start}
.fo.on{border-color:var(--acc);background:var(--acc-l)}
.fo svg{width:100%;height:auto;max-width:150px}
.fo b{font-size:16px;font-weight:900}
.fo small{color:var(--sub);font-size:12px;line-height:1.45}
.todo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-weight:700;background:#FFF0F0;border-radius:14px;padding:10px 12px}
.todo button{border:0;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900;color:var(--danger);box-shadow:0 2px 0 #F3D0D0}
.pvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.pv{margin:0;min-width:0}
@media (min-width:1080px){
#app.wide{max-width:1100px}
#app.wide #view{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:32px;align-items:start}
#app.wide #view>.bar{grid-column:1/-1}
#app.wide #view>.steps,#app.wide #view>.main{grid-column:1}
#app.wide #side{grid-column:2;grid-row:2/5;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,60px));max-height:calc(100vh - var(--barh,60px) - 16px);overflow:auto;padding:14px 6px 24px;display:grid;gap:12px;align-content:start}
#app.wide .navb{left:max(0px,calc(50% - 550px));transform:none;width:632px}
}
.sideh{font-weight:900;font-size:16px;display:grid;gap:2px}.sideh small{font-size:12px;font-weight:700;color:var(--sub)}
.sidep{display:grid;gap:14px}
.pvbox{display:block;width:100%;border:0;padding:0;cursor:zoom-in;aspect-ratio:148/210;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(90,60,30,.16);background:#fff;max-width:100%}
.pv figcaption{font-size:12px;text-align:center;color:var(--sub);margin-top:6px;font-weight:700}
.res{display:grid;gap:12px}
.res .ok{margin:0;font-size:20px;font-weight:900;text-align:center;color:var(--leaf-d)}
.sheets{display:grid;gap:10px}
.sheets img{width:100%;border-radius:6px;box-shadow:0 2px 10px rgba(90,60,30,.16);display:block}
.res .btns{display:grid;gap:12px}
.guide{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:15px}
.guide li::marker{font-weight:900;color:var(--acc-d)}
.fold svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.linkbox{font-size:13px;word-break:break-all;background:var(--soft);border-radius:12px;padding:10px 12px;border:2px solid var(--line);user-select:all;font-family:ui-monospace,monospace}
/* bottom nav */
.navb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,640px);box-sizing:border-box;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,244,226,0),var(--bg) 40%);display:grid;grid-template-columns:1fr 1.6fr;gap:10px;z-index:6}
body.typing .navb{display:none}
/* overlays */
#busy{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-weight:900;font-size:18px;padding:24px;text-align:center}
.spin{width:56px;height:56px;border-radius:50%;border:7px solid var(--acc-l);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;z-index:95;background:rgba(58,44,32,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{max-width:420px;width:100%;box-sizing:border-box}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:15px;max-width:min(90vw,480px);box-sizing:border-box;text-align:center}
#zoom{position:fixed;inset:0;z-index:96;background:rgba(40,30,22,.85)}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.zbar{display:flex;align-items:center;gap:10px;color:#fff}.zbar b{font-size:17px;font-weight:900}.zbar span{flex:1;font-size:13px;opacity:.8}
.zedit{border:0;border-radius:999px;background:var(--acc);color:var(--acc-on);font-weight:900;font-size:14px;padding:8px 14px;box-shadow:0 3px 0 var(--acc-d);white-space:nowrap}
.zbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

function composeMini(cs){const W=cs[1].width,H=cs[1].height,c=mkCanvas(W*4,H*2),x=c.getContext('2d');

  const m=/^days\.(\d)\.items\.(\d+)\.place$/.exec(t.dataset.f);if(m){const x=s.days[+m[1]].items[+m[2]];if(x&&!x.icm){const k=autoIc(x.place);if(k!==x.ic){x.ic=k;const b=document.querySelector(`[data-act=pickIc][data-d="${m[1]}"][data-i="${m[2]}"]`);if(b){const v=th(s);b.innerHTML=picInner(x,stC(v),v[2]);b.classList.toggle('on',!!k)}}}}
  if(t.dataset.f==='title'||t.dataset.f==='dest'){const bt=$('#bar-t');if(bt)bt.textContent=s.title||s.dest||'新しいしおり'}}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-photo]'))return onPhoto(t);if(t.matches('[data-import]'))return onImport(t);if(t.dataset.cat!==undefined){const s=cur();if(s){s.itemCat[t.dataset.cat]=+t.value;db.customItems[t.dataset.cat]=+t.value;touch(s)}return}if(t.hasAttribute('data-rr'))render()});
document.addEventListener('keydown',e=>{if(zi>=0){if(e.key==='Escape')closeZoom();else if(e.key==='ArrowRight')openZoom(zi+1);else if(e.key==='ArrowLeft')openZoom(zi-1);return}if(e.key!=='Enter')return;const t=e.target;if(t.id==='f-itemnew'){e.preventDefault();A.addItemNew()}else if(t.id==='f-promnew'){e.preventDefault();A.addPromNew()}});
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=file]),textarea,select'))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea,select'))document.body.classList.remove('typing')},60));
let tx=null;
addEventListener('touchstart',e=>{if(zi<0||e.touches.length!==1)return;tx={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
addEventListener('touchend',e=>{if(zi<0||!tx)return;const t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;tx=null;if(Math.abs(dx)>50&&Math.abs(dy)<60)openZoom(zi+(dx<0?1:-1))},{passive:true});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='home')render()});
load();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizePreviews);
})();
